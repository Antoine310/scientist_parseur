name: Real OpenHW CVA6 multi-family behavioral oracle (Verilator + cocotb)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-cva6-compressed-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout RTLPrep
        uses: actions/checkout@v4

      - name: Checkout exact OpenHW CVA6 sources (never vendored)
        uses: actions/checkout@v4
        with:
          repository: openhwfoundation/cva6
          ref: 742dc82a0c706e0a3bfb98b709fd3ee06d50d12a
          path: upstream_cva6
          sparse-checkout: |
            core/include/config_pkg.sv
            core/include/cv32a6_imac_sv32_config_pkg.sv
            core/include/riscv_pkg.sv
            core/include/build_config_pkg.sv
            core/compressed_decoder.sv
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify pinned Git commit and five actual blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream_cva6 rev-parse HEAD)" = "742dc82a0c706e0a3bfb98b709fd3ee06d50d12a"
          test "$(git -C upstream_cva6 hash-object core/include/config_pkg.sv)" = "a68b2c14ea758bc820a35cc3ac27035359763d0a"
          test "$(git -C upstream_cva6 hash-object core/include/cv32a6_imac_sv32_config_pkg.sv)" = "d0824c0b8202b1f2b048864f502ba2c7b2375e8f"
          test "$(git -C upstream_cva6 hash-object core/include/riscv_pkg.sv)" = "146bcc2c307ec236c3c0ca3854ca69ce6fdcecb9"
          test "$(git -C upstream_cva6 hash-object core/include/build_config_pkg.sv)" = "429080949a6626f4f42cdb1c717383bb3b7f3843"
          test "$(git -C upstream_cva6 hash-object core/compressed_decoder.sv)" = "76385e5ea0b9eb0cc2d0e96fe978a90d4e122c19"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned compatible Verilator
        uses: veryl-lang/setup-verilator@76aba8a3059d050453f35d4589e623ef60309089 # v2
        with:
          version: '5.040'

      - name: Install reviewed cocotb runner and verify versions
        run: |
          python -m pip install -e '.[dev,simulation]'
          python - <<'PY'
          import re
          import subprocess
          import cocotb
          assert cocotb.__version__ == "2.0.1", cocotb.__version__
          version = subprocess.check_output(["verilator", "--version"], text=True)
          match = re.search(r"Verilator (\d+)\.(\d+)", version)
          assert match and tuple(map(int, match.groups())) >= (5, 36), version
          print("PR44_EDA_VERSIONS", cocotb.__version__, version.strip())
          PY

      - name: Unit tests
        run: python -m pytest -q -rs -o addopts='' tests/test_cva6_compressed_pr44.py

      - name: Run official decoder and four isolated negative controls
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.run_cva6_compressed_oracle --source-root upstream_cva6 --out reports/pr44-gold --variant gold
          for family in addi addi4spn lw sw; do
            code=0
            python -m scripts.run_cva6_compressed_oracle --source-root upstream_cva6 --out "reports/pr44-$family" --variant "$family" || code=$?
            test "$code" -eq 2
          done
          python - <<'PY'
          import json
          from pathlib import Path
          def load(v):
              return json.loads(Path(f"reports/pr44-{v}/cva6_compressed_simulation.result.json").read_text())
          gold = load("gold")
          assert gold["status"] == "passed"
          assert gold["completed_stimulus_vectors"] == 9216
          assert gold["design_coverage"] == "not_measured"
          for family in ("addi","addi4spn","lw","sw"):
              bad = load(family)
              assert bad["status"] == "expected_mutation_failure"
              assert bad["mutation_failure_evidence"] is True
              assert bad["gold_source_sha256"] == gold["gold_source_sha256"]
              assert bad["mutant_sha256"] != gold["gold_source_sha256"]
              assert (bad["passed"],bad["failed"],bad["skipped"]) == (3,1,0)
          PY
          test "$(git -C upstream_cva6 hash-object core/compressed_decoder.sv)" = "76385e5ea0b9eb0cc2d0e96fe978a90d4e122c19"
          test -z "$(git -C upstream_cva6 status --porcelain)"

      - name: Preserve actual simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr44-real-cva6-compressed-oracles
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/pr44-*/cva6_compressed_simulation.result.json
            reports/pr44-*/simulation_results.xml
