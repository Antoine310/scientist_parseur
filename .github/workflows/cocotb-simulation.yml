name: Verilator cocotb behavioral simulations

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counter-behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout RTLPrep
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Verilator >= 5.036
        uses: veryl-lang/setup-verilator@76aba8a3059d050453f35d4589e623ef60309089 # v2
        with:
          version: '5.040'
      - name: Check the actual simulator version
        run: |
          verilator --version
          python - <<'PY'
          import re
          import subprocess
          version = subprocess.check_output(["verilator", "--version"], text=True)
          matched = re.search(r"Verilator (\d+)\.(\d+)", version)
          assert matched and tuple(map(int, matched.groups())) >= (5, 36), version
          PY
          make --version | head -1
          g++ --version | head -1
      - name: Install optional cocotb package
        run: |
          python -m pip install -e '.[dev,simulation]'
          python -c 'import cocotb; print("cocotb", cocotb.__version__)'
      - name: Check pure Python simulation/report tests
        run: python -m pytest -q tests/test_simulation.py
      - name: Run correct counter simulation (must pass)
        run: |
          python -m rtlprep simulate examples/counter/design.json \
            --out reports/sim-counter --timeout 180
          python - <<'PY'
          import json
          report=json.load(open("reports/sim-counter/simulation.result.json"))
          assert report["status"] == "passed", report
          assert (report["tests"], report["passed"], report["failed"]) == (3, 3, 0), report
          print("POSITIVE_SIMULATION_VALIDATED", report["testcases"])
          PY
      - name: Run real handshake FSM simulation (must pass)
        run: |
          python -m rtlprep simulate examples/fsm/design.json \
            --out reports/sim-fsm --timeout 180
          python - <<'PY'
          import json
          report=json.load(open("reports/sim-fsm/simulation.result.json"))
          assert report["status"] == "passed", report
          assert (report["tests"], report["passed"], report["failed"]) == (2, 2, 0), report
          print("FSM_SIMULATION_VALIDATED", report["testcases"])
          PY
      - name: Run intentionally buggy counter (must FAIL with evidence)
        shell: bash
        run: |
          set +e
          python -m rtlprep simulate examples/counter/buggy_design.json \
            --out reports/sim-buggy --timeout 180
          code=$?
          set -e
          test "$code" -eq 2 || { echo "Unexpected CLI exit code: $code"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("reports/sim-buggy/simulation.result.json")
          report=json.loads(p.read_text())
          assert report["status"] == "failed", report
          assert report["tests"] == 3, report
          assert report["failed"] >= 1, report
          assert Path(report["results_xml"]).is_file(), report
          assert any(c["status"] == "failed" for c in report["testcases"]), report
          print("EXPECTED_COUNTER_BUG_DETECTED", report["testcases"])
          PY
      - name: PR41 independent oracle on real unary-bit RTL (must PASS)
        run: |
          python -m rtlprep simulate tests/fixtures/unary_bit_pr41_good_design.json \
            --out reports/pr41-unary-good --timeout 180
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("reports/pr41-unary-good/simulation.result.json")
          report=json.loads(p.read_text())
          assert report["status"]=="passed", report
          assert (report["tests"],report["passed"],report["failed"],report["skipped"]) == (3,3,0,0), report
          assert Path(report["results_xml"]).is_file()
          assert report["suite"]=="rtlprep.sim_tests.unary_bit_oracle", report
          print("PR41_INDEPENDENT_ORACLE_GOOD_PASSED", report["testcases"])
          PY
      - name: PR41 same oracle on inverted-bit mutant (must FAIL with evidence)
        shell: bash
        run: |
          set +e
          python -m rtlprep simulate tests/fixtures/unary_bit_pr41_mutant_design.json \
            --out reports/pr41-unary-mutant --timeout 180
          code=$?
          set -e
          test "$code" -eq 2 || { echo "Unexpected mutant exit code: $code"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree
          good=json.loads(Path("reports/pr41-unary-good/simulation.result.json").read_text())
          bad=json.loads(Path("reports/pr41-unary-mutant/simulation.result.json").read_text())
          assert good["status"]=="passed" and bad["status"]=="failed", (good,bad)
          assert bad["tests"]==3 and bad["failed"]>=1 and bad["passed"]<3, bad
          assert good["source_fingerprint"] != bad["source_fingerprint"], (good,bad)
          xml_file=Path(bad["results_xml"])
          assert xml_file.is_file(), bad
          fails=ElementTree.parse(xml_file).findall(".//failure")
          assert fails, "Mutant did not produce a cocotb assertion failure"
          text="\n".join(str(el.attrib)+" "+(el.text or "") for el in fails)
          stdout=Path("reports/pr41-unary-mutant/simulation.stdout.log").read_text(encoding="utf-8")
          assert "port=bit_o" in text or "port=bit_o" in stdout, (
              "Mutant failure was not the expected bit-15 inversion defect: "+text[:1000]
          )
          print("PR41_INTENTIONAL_MUTATION_DETECTED", bad["testcases"])
          PY
      - name: Upload positive and negative simulation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-verilator-counter-reports
          retention-days: 14
          if-no-files-found: warn
          path: |
            reports/sim-counter/simulation.result.json
            reports/sim-counter/simulation_results.xml
            reports/sim-counter/simulation.stdout.log
            reports/sim-counter/simulation.stderr.log
            reports/sim-fsm/simulation.result.json
            reports/sim-fsm/simulation_results.xml
            reports/sim-fsm/simulation.stdout.log
            reports/sim-fsm/simulation.stderr.log
            reports/sim-buggy/simulation.result.json
            reports/sim-buggy/simulation_results.xml
            reports/sim-buggy/simulation.stdout.log
            reports/sim-buggy/simulation.stderr.log
            reports/pr41-unary-good/simulation.result.json
            reports/pr41-unary-good/simulation_results.xml
            reports/pr41-unary-good/simulation.stdout.log
            reports/pr41-unary-good/simulation.stderr.log
            reports/pr41-unary-mutant/simulation.result.json
            reports/pr41-unary-mutant/simulation_results.xml
            reports/pr41-unary-mutant/simulation.stdout.log
            reports/pr41-unary-mutant/simulation.stderr.log
