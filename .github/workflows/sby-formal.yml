name: SymbiYosys formal proof and counterexample

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counter-and-fsm-formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout RTLPrep
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned open-source Yosys SBY and SMT tools
        uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df # v4
        with:
          version: '2026-11-18'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check actual formal toolchain
        run: |
          yosys -V
          sby --version
          z3 --version
      - name: Install Python package and unit tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_formal.py
      - name: PROVE counter properties and COVER non-vacuity
        run: |
          python -m rtlprep formal examples/counter/design.json \
            --out reports/formal-counter --timeout 150
          python - <<'PY'
          import json
          report=json.load(open("reports/formal-counter/formal.result.json"))
          assert report["status"] == "passed", report
          assert report["proof"]["sby_status"] == "PASS", report
          assert report["cover"]["sby_status"] == "PASS", report
          print("COUNTER_FORMAL_VERIFIED", report["proof"], report["cover"])
          PY
      - name: PROVE FSM transition properties and COVER DONE state
        run: |
          python -m rtlprep formal examples/fsm/design.json \
            --out reports/formal-fsm --timeout 150
          python - <<'PY'
          import json
          report=json.load(open("reports/formal-fsm/formal.result.json"))
          assert report["status"] == "passed", report
          assert report["proof"]["sby_status"] == "PASS", report
          assert report["cover"]["sby_status"] == "PASS", report
          print("FSM_FORMAL_VERIFIED", report["proof"], report["cover"])
          PY
      - name: REQUIRE a genuine SBY counterexample on buggy counter
        shell: bash
        run: |
          set +e
          python -m rtlprep formal examples/counter/buggy_design.json \
            --out reports/formal-buggy --timeout 150
          exit_code=$?
          set -e
          test "$exit_code" -eq 2 || { echo "Expected RTLPrep exit 2, got $exit_code"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.load(open("reports/formal-buggy/formal.result.json"))
          assert report["status"] == "failed", report
          assert report["proof"]["sby_status"] == "FAIL", report
          traces=report["proof"]["trace_files"]
          assert traces and all(Path(p).is_file() for p in traces), report
          print("BUGGY_COUNTEREXAMPLE_DETECTED", traces)
          PY
      - name: PR96 independent modular addition model (Z3)
        run: python -m scripts.prove_addition_pr96 --out reports/pr96-formal

      - name: PR97 zero extended addition model (Z3)
        run: python -m scripts.prove_zero_extended_addition_pr97 --out reports/pr97-formal

      - name: PR98 constant increment model (Z3)
        run: python -m scripts.prove_constant_increments_pr98 --out reports/pr98-formal

      - name: PR99 subtraction and shift-mask models (Z3)
        run: python -m scripts.prove_subtraction_pr99 --out reports/pr99-formal

      - name: PR100 independent equality models (Z3)
        run: python -m scripts.prove_comparison_pr100 --out reports/pr100-formal

      - name: PR101 controlled signed order models (Z3)
        run: python -m scripts.prove_signed_order_pr101 --out reports/pr101-formal

      - name: PR106 scalar concat NBA statement models (Z3)
        run: python -m scripts.prove_concat_nba_pr106 --out reports/pr106-formal

      - name: PR108 scoped generate NBA fixed selection models (Z3)
        run: python -m scripts.prove_generate_nba_pr108 --out reports/pr108-formal

      - name: PR109 vector concat NBA models (Z3)
        run: python -m scripts.prove_vector_concat_pr109 --out reports/pr109-formal

      - name: PR110 direct Initial zero conversion models (Z3)
        run: python -m scripts.prove_initial_zero_pr110 --out reports/pr110-formal

      - name: PR111 logical reduction binary fixture models (Z3)
        run: python -m scripts.prove_logical_reduction_pr111 --out reports/pr111-formal

      - name: PR112 logical shift binary models (Z3)
        run: python -m scripts.prove_shift_candidates_pr112 --out reports/pr112-formal

      - name: PR113 controlled signed shift binary models (Z3)
        run: python -m scripts.prove_signed_shift_pr113 --out reports/pr113-formal

      - name: PR114 full signed product binary models (Z3)
        run: python -m scripts.prove_signed_multiply_pr114 --out reports/pr114-formal

      - name: PR115 constant conversion binary models (Z3)
        run: python -m scripts.prove_constant_conversions_pr115 --out reports/pr115-formal

      - name: PR116 dynamic conversion binary models (Z3)
        run: python -m scripts.prove_dynamic_conversions_pr116 --out reports/pr116-formal
      - name: Upload formal reports, proof logs and traces (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtlprep-sby-formal-results
          retention-days: 14
          if-no-files-found: warn
          path: |
            reports/pr96-formal/**
            reports/pr97-formal/**
            reports/pr98-formal/**
            reports/pr99-formal/**
            reports/pr100-formal/**
            reports/pr101-formal/**
            reports/pr106-formal/**
            reports/pr108-formal/**
            reports/pr109-formal/**
            reports/pr110-formal/**
            reports/pr111-formal/**
            reports/pr112-formal/**
            reports/pr113-formal/**
            reports/pr114-formal/**
            reports/pr115-formal/**
            reports/pr116-formal/**
            reports/formal-*/formal.result.json
            reports/formal-*/formal_*.sby
            reports/formal-*/formal_*.result.json
            reports/formal-*/formal_*.stdout.log
            reports/formal-*/formal_*.stderr.log
            reports/formal-*/formal_*_work/logfile.txt
            reports/formal-*/formal_*_work/status
            reports/formal-*/formal_*_work/engine_*/trace*.vcd
