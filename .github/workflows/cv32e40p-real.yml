name: Real CV32E40P decoder RTL test

on:
  pull_request:
  push:
    branches:
      - main
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-cv32e40p-decoder:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout RTLPrep
        uses: actions/checkout@v4
      - name: Checkout pinned OpenHW CV32E40P source (sparse, read-only)
        uses: actions/checkout@v4
        with:
          repository: openhwfoundation/cv32e40p
          ref: b353438ff469c030c89f6804f3b24a2852880e8b
          path: upstream_cv32e40p
          sparse-checkout: |
            rtl/include/cv32e40p_pkg.sv
            rtl/cv32e40p_compressed_decoder.sv
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check upstream revision and original file hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream_cv32e40p rev-parse HEAD)" = "b353438ff469c030c89f6804f3b24a2852880e8b"
          test "$(git -C upstream_cv32e40p hash-object rtl/cv32e40p_compressed_decoder.sv)" = "4621c754d315e2cf3d5929b9d211bd382c5b32ae"
          test "$(git -C upstream_cv32e40p hash-object rtl/include/cv32e40p_pkg.sv)" = "319e790b62623d5daa0388cc92af1ce83aed61fc"
          echo "Pinned upstream source and package confirmed."
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install RTLPrep and tests
        run: python -m pip install -e '.[dev]'
      - name: Install pinned slang v12.1
        shell: bash
        run: |
          set -euo pipefail
          SLANG_URL="https://github.com/MikePopoloski/slang/releases/download/v12.1/slang-linux-x86_64.tar.gz"
          mkdir -p "$RUNNER_TEMP/slang-dist"
          curl --fail --location --show-error --silent --retry 3 \
            "$SLANG_URL" -o "$RUNNER_TEMP/slang.tar.gz"
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$RUNNER_TEMP/slang-dist"
          BIN_PATH="$(find "$RUNNER_TEMP/slang-dist" -type f -name slang -perm /111 -print -quit)"
          test -n "$BIN_PATH"
          sudo install -m 0755 "$BIN_PATH" /usr/local/bin/slang
          slang --version
      - name: Run real CV32E40P compressed decoder experiment
        run: |
          python scripts/run_cv32e40p_decoder.py \
            --source-root upstream_cv32e40p \
            --out reports/cv32e40p \
            --timeout 180
      - name: Inspect slang list-shaped statements (temporary diagnostic)
        if: always()
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          p="reports/cv32e40p/elaborated_ast.json"
          try: obj=json.load(open(p))
          except FileNotFoundError: exit(0)
          root=next(x for x in obj["design"]["members"] if x.get("kind")=="Instance")
          print("REAL_MEMBER_KINDS",dict(Counter(m.get("kind") for m in root["body"]["members"] if isinstance(m,dict))))
          def recurse(obj,depth=0):
              if depth>15:return
              if isinstance(obj,list):
                  for x in obj[:4]:recurse(x,depth+1)
              elif isinstance(obj,dict):
                  k=obj.get("kind")
                  if k=="List":
                      print("AST_LIST_KEYS",list(obj.keys()))
                      for key,val in obj.items():
                          if isinstance(val,list):
                              print("AST_LIST_CHILDREN",key,len(val),[x.get("kind") if isinstance(x,dict) else str(type(x)) for x in val[:7]])
                          elif isinstance(val,dict):
                              print("AST_LIST_CHILD_OBJ",key,val.get("kind"),list(val.keys())[:10])
                  for key,val in obj.items():
                      if key in ("addr","internalSymbol","definition","connections","type"):continue
                      if isinstance(val,(dict,list)):recurse(val,depth+1)
          for m in root["body"]["members"]:
              if m.get("kind")=="ProceduralBlock":recurse(m,0)
          PY
      - name: Upload reports and relevant logs (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv32e40p-real-rtlprep-results
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/cv32e40p/cv32e40p_test_report.json
            reports/cv32e40p/deps.result.json
            reports/cv32e40p/index.result.json
            reports/cv32e40p/analyze.result.json
            reports/cv32e40p/analyze.stderr.log
            reports/cv32e40p/analyze.stdout.log
            reports/cv32e40p/rtl_index.json
            reports/cv32e40p/rtl_dependencies.json
