name: Python unit tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e '.[dev]'
      - name: Verify pinned developer toolchains and Python constraints (offline)
        run: python scripts/rtlprep_env.py --verify-lock
      - name: Unit tests (no EDA tools required)
        run: python -m pytest -q
      - name: Check CLI
        run: python -m rtlprep doctor
