      - member-writes-pr80
      - packed-members-pr79
      - aggregate-pr78
      - analysis-budgets-pr62
      - analyzer-row-budgets-pr68
      - annotated-pr56
      - array-pr60
      - bit-refinement-pr61
      - bit-width-pr69
      - bit-width-pr70
      - bitgraph-pr54
      - bitwise-pr72
      - cocotb-simulation
      - complex-pr53
      - constant-indices-pr57
      - cv32e40p-alu-real
      - cv32e40p-core-pr65
      - cv32e40p-diagnostics-pr67
      - cv32e40p-ex-stage-pr64
      - cv32e40p-multi-unit-pr63
      - cv32e40p-popcnt-eqy
      - cv32e40p-real
      - cva6-cj-verilator-oracle
      - cva6-cli-verilator-oracle
      - cva6-compressed-decoder
      - cva6-compressed-verilator-oracle
      - cva6-lane-evidence
      - cva6-ras
      - dynamic-pr74
      - eqy-equivalence
      - function-pr58
      - hierarchy-pr52
      - intercycle-pr51
      - mcp-stdio
      - mux-pr73
      - packed-coordinates-pr71
      - priority-pr47
      - reset-formal-pr48
      - rtl-benchmark
      - rtl-fixtures
      - rtl-security-lab
      - sby-formal
      - scalability-pr55
      - selector-recovery-pr75
      - slang-integration
      - static-loops-pr59
      - typed-layout-pr76
      - unknown-rtl-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every historical validation to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS_JSON"
          jq -e 'length == 49 and all(.[]; .result == "success")' <<< "$NEEDS_JSON"
