name: RTLPrep CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only obsolete PR runs are cancelled. Each main/manual run is independent.
concurrency:
  group: rtlprep-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e '.[dev]'
      - name: Verify pinned developer toolchains and Python constraints (offline)
        run: python scripts/rtlprep_env.py --verify-lock
      - name: Python syntax preflight
        run: python -m compileall -q rtlprep scripts tests
      - name: Unit tests (no EDA tools required)
        run: python -m pytest -q
      - name: Check CLI
        run: python -m rtlprep doctor

  analysis-budgets-pr62:
    needs: unit-tests
    uses: ./.github/workflows/analysis-budgets-pr62.yml

  analyzer-row-budgets-pr68:
