          refs=(reports/pr80/run-*/reference/run-*/diagnostics.result.json)
          test "${#refs[@]}" -eq 1
          test -f "${refs[0]}"
          python -m scripts.run_member_cli_pr93 --out reports/pr93 --reference "${refs[0]}"

      - name: PR94 member evidence real MCP stdio (reuse fresh PR93 CLI graphs)
        run: |
          set -euo pipefail
          python -m pip install -e '.[mcp]'
          python -m pytest -q tests/test_member_mcp_pr94.py
          refs=(reports/pr93/run-*/summary.json)
          test "${#refs[@]}" -eq 1
          test -f "${refs[0]}"
          python -m scripts.run_member_mcp_pr94 --out reports/pr94 --reference "${refs[0]}"

      - name: PR95 exact residual flat-row audit
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_residual_audit_pr95.py
          refs=(reports/pr80/run-*/reference/run-*/diagnostics.result.json)
          test "${#refs[@]}" -eq 1
          test -f "${refs[0]}"
          python -m scripts.run_residual_audit_pr95 --out reports/pr95 --reference "${refs[0]}"

      - name: PR96 direct addition candidates and real fixture
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_addition_pr96.py
          refs=(reports/pr80/run-*/reference/run-*/diagnostics.result.json)
          test "${#refs[@]}" -eq 1
          test -f "${refs[0]}"
          python -m scripts.run_addition_pr96 --out reports/pr96 --reference "${refs[0]}"

      - name: PR97 zero extended popcnt additions and behavioral oracle
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_zero_extended_addition_pr97.py
          refs=(reports/pr80/run-*/reference/run-*/diagnostics.result.json)
          test "${#refs[@]}" -eq 1
          test -f "${refs[0]}"
          python -m scripts.run_zero_extended_addition_pr97 --out reports/pr97 --reference "${refs[0]}"

      - name: PR98 constant increment candidates and fixture
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_constant_increments_pr98.py
          refs=(reports/pr80/run-*/reference/run-*/diagnostics.result.json)
          test "${#refs[@]}" -eq 1
          test -f "${refs[0]}"
          python -m scripts.run_constant_increments_pr98 --out reports/pr98 --reference "${refs[0]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: member-writes-pr80
          path: |
            reports/pr80/**/member_writes.result.json
            reports/pr80/**/summary.json
            reports/pr80/**/diagnostics.result.json
            reports/pr80/**/elaborated_ast.json
            reports/pr80/**/rtl_dependencies.json
            reports/pr80/**/simulation_results.xml
            reports/pr80/**/analyze.stderr.log
            reports/pr81/**/enum_member_writes.result.json
            reports/pr81/**/summary.json
            reports/pr81/**/elaborated_ast.json
            reports/pr81/**/simulation_results.xml
            reports/pr82/**/local_packed_members.result.json
            reports/pr82/**/summary.json
            reports/pr82/**/elaborated_ast.json
            reports/pr82/**/simulation_results.xml
            reports/pr83/**/member_expressions.result.json
            reports/pr83/**/summary.json
            reports/pr83/**/elaborated_ast.json
