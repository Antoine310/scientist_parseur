          refs=(reports/pr80/run-*/reference/run-*/diagnostics.result.json)
          test "${#refs[@]}" -eq 1
          test -f "${refs[0]}"
          python -m scripts.run_member_optimization_pr92 --out reports/pr92 --reference "${refs[0]}" --repeats 3

      - name: PR93 CLI member channels and read-only queries
        run: |
          set -euo pipefail
