name: Real slang integration

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slang-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and Python tests
        run: python -m pip install -e '.[dev]'
      - name: Install pinned slang release (real compiler)
        shell: bash
        run: |
          set -euo pipefail
          SLANG_VERSION="v12.1"
          SLANG_URL="https://github.com/MikePopoloski/slang/releases/download/${SLANG_VERSION}/slang-linux-x86_64.tar.gz"
          mkdir -p "$RUNNER_TEMP/slang-dist"
          curl --fail --location --show-error --silent --retry 3 \
            "$SLANG_URL" -o "$RUNNER_TEMP/slang.tar.gz"
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$RUNNER_TEMP/slang-dist"
          BIN_PATH="$(find "$RUNNER_TEMP/slang-dist" -type f -name slang -perm /111 -print -quit)"
          test -n "$BIN_PATH"
          sudo install -m 0755 "$BIN_PATH" /usr/local/bin/slang
          slang --version
      - name: Run unit tests
        run: python -m pytest -q tests/test_starter.py tests/test_analysis.py tests/test_index.py
      - name: Run REAL slang tests (must not be skipped)
        run: |
          python -m pytest -vv -rs -o addopts='' tests/test_integration_slang.py
      - name: Show example summary
        run: |
          python -m rtlprep analyze examples/hierarchy/design.json --out reports/ci-hierarchy
          python -m json.tool reports/ci-hierarchy/design_summary.json
      - name: Exercise RTL index and CLI queries
        run: |
          python -m rtlprep index examples/hierarchy/design.json --out reports/ci-index
          python -m rtlprep query reports/ci-index/rtl_index.json modules
          python -m rtlprep query reports/ci-index/rtl_index.json module leaf
          python -m rtlprep query reports/ci-index/rtl_index.json signal hierarchy_top.first status
          python -m rtlprep source examples/hierarchy/design.json leaf.sv --line 2
      - name: Inspect dependency expression and connection nodes (temporary)
        run: |
          python -m rtlprep analyze examples/dependencies/design.json --out reports/ci-deps
          python -m rtlprep analyze examples/counter/design.json --out reports/ci-counter
          python - <<'PY'
          import json
          skip={"addr","internalSymbol","definition"}
          def clean(obj,depth=0):
              if depth>13:return "<depth limit>"
              if isinstance(obj,dict):
                  return {k:clean(v,depth+1) for k,v in obj.items() if k not in skip}
              if isinstance(obj,list):
                  return [clean(v,depth+1) for v in obj[:25]]
              return obj
          for case in ("deps","counter"):
              ast=json.load(open(f"reports/ci-{case}/elaborated_ast.json"))
              top=next(n for n in ast["design"]["members"] if isinstance(n,dict) and n.get("kind")=="Instance")
              print("AST_TOP",case,top["name"])
              def visit(inst):
                  path=inst["name"]
                  print("AST_INSTANCE",path,"CONNECTIONS",json.dumps(clean(inst.get("connections")),ensure_ascii=False)[:10000])
                  for node in inst["body"]["members"]:
                      k=node.get("kind") if isinstance(node,dict) else None
                      if k in ("Port","Net","Variable"):continue
                      print("AST_NODE",case,path,k,json.dumps(clean(node),ensure_ascii=False)[:13500])
                      if k=="Instance":visit(node)
              visit(top)
          PY
      - name: Upload diagnostic logs if job fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slang-diagnostics
          path: reports/
          if-no-files-found: ignore
