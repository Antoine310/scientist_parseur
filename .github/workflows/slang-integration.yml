name: Real slang integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slang-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and Python tests
        run: python -m pip install -e '.[dev]'
      - name: Install pinned slang release (real compiler)
        shell: bash
        run: |
          set -euo pipefail
          SLANG_VERSION="v12.1"
          SLANG_URL="https://github.com/MikePopoloski/slang/releases/download/${SLANG_VERSION}/slang-linux-x86_64.tar.gz"
          mkdir -p "$RUNNER_TEMP/slang-dist"
          curl --fail --location --show-error --silent --retry 3 \
            "$SLANG_URL" -o "$RUNNER_TEMP/slang.tar.gz"
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$RUNNER_TEMP/slang-dist"
          BIN_PATH="$(find "$RUNNER_TEMP/slang-dist" -type f -name slang -perm /111 -print -quit)"
          test -n "$BIN_PATH"
          sudo install -m 0755 "$BIN_PATH" /usr/local/bin/slang
          slang --version
      - name: Run unit tests
        run: python -m pytest -q tests/test_starter.py tests/test_analysis.py tests/test_index.py tests/test_dependencies.py tests/test_advanced_dependencies.py
      - name: Run REAL slang tests (must not be skipped)
        run: |
          python -m pytest -vv -rs -o addopts='' tests/test_integration_slang.py
      - name: Import nested SystemVerilog filelist and compile real slang
        run: |
          python -m pytest -q -rs tests/test_integration_filelist_slang.py
          python -m rtlprep import-filelist examples/filelist_project/compile.f \
            --root examples/filelist_project --top imported_top \
            --out reports/ci-filelist/design.json
          python -m rtlprep deps reports/ci-filelist/design.json --out reports/ci-filelist
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path("reports/ci-filelist")
          data = json.loads((out / "rtl_index.json").read_text())
          graph = json.loads((out / "rtl_dependencies.json").read_text())
          manifest = json.loads((out / "design.json").read_text())
          assert data["top"] == graph["top"] == manifest["top"] == "imported_top"
          assert [Path(p).name for p in manifest["sources"]] == ["pkg.sv", "top.sv"]
          assert graph["counts"]["edges"] > 0
          print("FILELIST_IMPORT_REAL_SLANG_PASSED", graph["counts"])
          PY
      - name: Show example summary
        run: |
          python -m rtlprep analyze examples/hierarchy/design.json --out reports/ci-hierarchy
          python -m json.tool reports/ci-hierarchy/design_summary.json
      - name: Exercise RTL index and CLI queries
        run: |
          python -m rtlprep index examples/hierarchy/design.json --out reports/ci-index
          python -m rtlprep query reports/ci-index/rtl_index.json modules
          python -m rtlprep query reports/ci-index/rtl_index.json module leaf
          python -m rtlprep query reports/ci-index/rtl_index.json signal hierarchy_top.first status
          python -m rtlprep source examples/hierarchy/design.json leaf.sv --line 2
      - name: Verify dependency graph and signal traces
        run: |
          python -m rtlprep deps examples/dependencies/design.json --out reports/ci-deps
          python -m rtlprep trace reports/ci-deps/rtl_dependencies.json fanin dependency_top.out --depth 6
          python -m rtlprep trace reports/ci-deps/rtl_dependencies.json fanout dependency_top.a --depth 6
          python - <<'PY'
          import json
          graph=json.load(open("reports/ci-deps/rtl_dependencies.json"))
          print("DEPENDENCY_COUNTS", graph["counts"])
          print("WARNINGS", graph["warnings"])
          assert graph["counts"]["warnings"] == 0
          assert graph["counts"]["edges"] >= 14
          PY
      - name: Validate advanced RTL graph (real slang)
        run: |
          python -m rtlprep deps examples/advanced/design.json --out reports/ci-advanced
          python -m rtlprep trace reports/ci-advanced/rtl_dependencies.json fanin advanced_logic.result --depth 3
          python - <<'PY'
          import json
          graph=json.load(open("reports/ci-advanced/rtl_dependencies.json"))
          print("ADVANCED_GRAPH_COUNTS",graph["counts"])
          print("ADVANCED_WARNINGS",graph["warnings"])
          assert graph["counts"]["warnings"] == 1
          assert graph["counts"]["edges"] >= 10
          PY
      - name: Upload diagnostic logs if job fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slang-diagnostics
          path: reports/
          if-no-files-found: ignore
