name: Real slang integration

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slang-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and Python tests
        run: python -m pip install -e '.[dev]'
      - name: Install pinned slang release (real compiler)
        shell: bash
        run: |
          set -euo pipefail
          SLANG_VERSION="v12.1"
          SLANG_URL="https://github.com/MikePopoloski/slang/releases/download/${SLANG_VERSION}/slang-linux-x86_64.tar.gz"
          mkdir -p "$RUNNER_TEMP/slang-dist"
          curl --fail --location --show-error --silent --retry 3 \
            "$SLANG_URL" -o "$RUNNER_TEMP/slang.tar.gz"
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$RUNNER_TEMP/slang-dist"
          BIN_PATH="$(find "$RUNNER_TEMP/slang-dist" -type f -name slang -perm /111 -print -quit)"
          test -n "$BIN_PATH"
          sudo install -m 0755 "$BIN_PATH" /usr/local/bin/slang
          slang --version
      - name: Run unit tests
        run: python -m pytest -q tests/test_starter.py tests/test_analysis.py tests/test_index.py tests/test_dependencies.py
      - name: Run REAL slang tests (must not be skipped)
        run: |
          python -m pytest -vv -rs -o addopts='' tests/test_integration_slang.py
      - name: Show example summary
        run: |
          python -m rtlprep analyze examples/hierarchy/design.json --out reports/ci-hierarchy
          python -m json.tool reports/ci-hierarchy/design_summary.json
      - name: Exercise RTL index and CLI queries
        run: |
          python -m rtlprep index examples/hierarchy/design.json --out reports/ci-index
          python -m rtlprep query reports/ci-index/rtl_index.json modules
          python -m rtlprep query reports/ci-index/rtl_index.json module leaf
          python -m rtlprep query reports/ci-index/rtl_index.json signal hierarchy_top.first status
          python -m rtlprep source examples/hierarchy/design.json leaf.sv --line 2
      - name: Verify dependency graph and signal traces
        run: |
          python -m rtlprep deps examples/dependencies/design.json --out reports/ci-deps
          python -m rtlprep trace reports/ci-deps/rtl_dependencies.json fanin dependency_top.out --depth 6
          python -m rtlprep trace reports/ci-deps/rtl_dependencies.json fanout dependency_top.a --depth 6
          python - <<'PY'
          import json
          graph=json.load(open("reports/ci-deps/rtl_dependencies.json"))
          print("DEPENDENCY_COUNTS", graph["counts"])
          print("WARNINGS", graph["warnings"])
          assert graph["counts"]["warnings"] == 0
          assert graph["counts"]["edges"] >= 14
          PY
      - name: Explore real AST of advanced RTL (temporary)
        run: |
          python -m rtlprep analyze examples/advanced/design.json --out reports/ci-advanced
          python - <<'PY'
          import json
          raw=json.load(open("reports/ci-advanced/elaborated_ast.json"))
          inst=next(n for n in raw["design"]["members"] if isinstance(n,dict) and n.get("kind")=="Instance")
          print("ADVANCED_BODY",list(inst["body"].keys()))
          ignored={"addr","internalSymbol","definition"}
          def tidy(x,depth=0):
              if depth>19:return "<depth>"
              if isinstance(x,dict):return {k:tidy(v,depth+1) for k,v in x.items() if k not in ignored}
              if isinstance(x,list):return [tidy(y,depth+1) for y in x[:35]]
              return x
          for m in inst["body"]["members"]:
              if not isinstance(m,dict):continue
              if m.get("kind") in ("Port","Net","Variable","Parameter"):continue
              print("AST_ADVANCED",m.get("kind"),json.dumps(tidy(m),ensure_ascii=False)[:35000])
          PY
      - name: Upload diagnostic logs if job fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slang-diagnostics
          path: reports/
          if-no-files-found: ignore
