name: Real slang integration

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slang-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and Python tests
        run: python -m pip install -e '.[dev]'
      - name: Install pinned slang release (real compiler)
        shell: bash
        run: |
          set -euo pipefail
          SLANG_VERSION="v12.1"
          SLANG_URL="https://github.com/MikePopoloski/slang/releases/download/${SLANG_VERSION}/slang-linux-x86_64.tar.gz"
          mkdir -p "$RUNNER_TEMP/slang-dist"
          curl --fail --location --show-error --silent --retry 3 \
            "$SLANG_URL" -o "$RUNNER_TEMP/slang.tar.gz"
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$RUNNER_TEMP/slang-dist"
          BIN_PATH="$(find "$RUNNER_TEMP/slang-dist" -type f -name slang -perm /111 -print -quit)"
          test -n "$BIN_PATH"
          sudo install -m 0755 "$BIN_PATH" /usr/local/bin/slang
          slang --version
      - name: Run unit tests
        run: python -m pytest -q tests/test_starter.py tests/test_analysis.py
      - name: Run REAL slang tests (must not be skipped)
        run: |
          python -m pytest -vv -rs -o addopts='' tests/test_integration_slang.py
      - name: Show example summary
        run: |
          python -m rtlprep analyze examples/hierarchy/design.json --out reports/ci-hierarchy
          python -m json.tool reports/ci-hierarchy/design_summary.json
      - name: Inspect actual slang AST schema
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          obj=json.load(open("reports/ci-hierarchy/elaborated_ast.json"))
          root=obj["design"]
          print("ROOT_KEYS",list(root))
          for node in root.get("members",[])[:3]:
              print("ROOT_NODE",str(node)[:400])
              if node.get("kind")!="Instance":continue
              body=node.get("body",{})
              print("INSTANCE_KEYS",list(node),"BODY_KEYS",list(body))
              for member in body.get("members",[])[:25]:
                  info={k: v for k,v in member.items() if k in ("kind","name","type","direction","sourceRange","sourceInfo","location","syntax","sourceFile","index")}
                  print("MEMBER",json.dumps(info,ensure_ascii=False)[:500],"KEYS",list(member)[:20])
                  if member.get("kind")=="Instance":
                      print("CHILD_BODY_KEYS",list(member.get("body",{})))
                      for child in member.get("body",{}).get("members",[])[:8]:
                          print("CHILD_MEMBER",json.dumps({k:v for k,v in child.items() if k in ("kind","name","type","direction","sourceRange","sourceInfo")},ensure_ascii=False)[:500])
          print("ROOT_COUNTS",Counter(x.get("kind") for x in root.get("members",[]) if isinstance(x,dict)))
          PY
      - name: Upload diagnostic logs if job fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slang-diagnostics
          path: reports/
          if-no-files-found: ignore
