name: Real CV32E40P popcount EQY equivalence

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-cv32e40p-popcount-eqy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout RTLPrep
        uses: actions/checkout@v4
      - name: Checkout pinned real OpenHW popcount RTL
        uses: actions/checkout@v4
        with:
          repository: openhwfoundation/cv32e40p
          ref: b353438ff469c030c89f6804f3b24a2852880e8b
          path: upstream_cv32e40p
          sparse-checkout: |
            rtl/cv32e40p_popcnt.sv
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify exact OpenHW commit and original Git blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream_cv32e40p rev-parse HEAD)" = "b353438ff469c030c89f6804f3b24a2852880e8b"
          test "$(git -C upstream_cv32e40p hash-object rtl/cv32e40p_popcnt.sv)" = "c7fe53e810c411a4cef0ab6ae8591b9e54e652f9"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YosysHQ pinned OSS CAD Suite EQY SBY and Z3
        uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df
        with:
          version: '2026-11-18'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify formal toolchain
        run: |
          yosys -V
          eqy --version
          sby --version
          z3 --version
      - name: Install RTLPrep and test strict source allowlist
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_equivalence.py tests/test_eqy_cv32e40p.py
      - name: Check real OpenHW packed-array SystemVerilog with Yosys
        run: |
          yosys -Q -p "read_verilog -sv upstream_cv32e40p/rtl/cv32e40p_popcnt.sv; hierarchy -check -top cv32e40p_popcnt; stat"
      - name: Prove refactoring and detect real error with EQY
        run: |
          python scripts/run_cv32e40p_popcnt_eqy.py \
            --source-root upstream_cv32e40p \
            --out reports/cv32e40p-popcnt-eqy \
            --timeout 180
      - name: Upload verified equivalence reports and VCD traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv32e40p-popcnt-eqy-report
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/cv32e40p-popcnt-eqy/cv32e40p_popcnt_eqy_report.json
            reports/cv32e40p-popcnt-eqy/**/equivalence.eqy
            reports/cv32e40p-popcnt-eqy/**/equivalence.result.json
            reports/cv32e40p-popcnt-eqy/**/equivalence.stdout.log
            reports/cv32e40p-popcnt-eqy/**/equivalence.stderr.log
            reports/cv32e40p-popcnt-eqy/**/eqy_work/logfile.txt
            reports/cv32e40p-popcnt-eqy/**/eqy_work/PASS
            reports/cv32e40p-popcnt-eqy/**/eqy_work/FAIL
            reports/cv32e40p-popcnt-eqy/**/eqy_work/partition.list
            reports/cv32e40p-popcnt-eqy/**/eqy_work/**/status
            reports/cv32e40p-popcnt-eqy/**/eqy_work/**/trace*.vcd
